# Builds the React site and publishes it to GitHub Pages.
#
# It runs:
#   - on every push to main (your code changes go live in about a minute)
#   - every 3 hours, to pick up new blog posts from your RSS feed
#   - when you click "Run workflow" on the Actions tab (to show a new post right away)

name: Deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 */3 * * *" # minute 23 of every 3rd hour, UTC
  workflow_dispatch:

# Never run two deploys at the same time; a newer one waits for the older one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # GitHub switches off scheduled runs in repos with no commits for 60 days.
  # Re-enabling the workflow through the API resets that timer, so the blog
  # keeps updating even if you never touch this repo again.
  keep-schedule-alive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh api --method PUT "repos/${{ github.repository }}/actions/workflows/deploy.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
